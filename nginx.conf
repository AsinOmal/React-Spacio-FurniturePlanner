# Nginx config TEMPLATE — the official nginx image runs envsubst on files in
# /etc/nginx/templates/*.template at container start, substituting ${BACKEND_URL}
# (and only env-vars that exist, so nginx's own $uri/$host/etc. are left alone).
#
#   Local Docker : BACKEND_URL=http://backend:5005      (docker-compose service)
#   Choreo       : BACKEND_URL=https://<your-backend>.choreoapis.dev   (set as a config)
#
# Because the SPA and the API are served from the SAME origin (this nginx),
# relative /api calls and the httpOnly sameSite=strict refresh cookie keep working.

server {
    # Non-privileged port — the nginx-unprivileged image runs as a non-root user.
    listen 8080;
    server_name localhost;

    # Choreo runs the container with a READ-ONLY root filesystem; keep every
    # path nginx writes to at runtime under /tmp (the one writable location).
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # Serve the static React build; fall back to index.html for client-side routing.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + uploaded 3D models to the backend. We intentionally do NOT set
    # `Host`, so nginx uses the host from BACKEND_URL — required for Choreo's
    # gateway routing/TLS. proxy_ssl_server_name enables SNI for https upstreams.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass ${BACKEND_URL}/uploads/;
        proxy_ssl_server_name on;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
