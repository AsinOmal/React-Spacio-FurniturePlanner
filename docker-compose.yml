version: "3.8"

services:
  db:
    image: mongo:6-jammy
    container_name: spacio_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - spacio_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spacio_backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGODB_URI=mongodb://db:27017/spacio
      - JWT_SECRET=${JWT_SECRET:-spacio_default_secret_please_change}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-spacio_default_refresh_secret_change}
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacio_frontend
    restart: unless-stopped
    ports:
      # host 80 → container 8080 (nginx-unprivileged listens on 8080)
      - "80:8080"
    environment:
      # nginx proxies /api and /uploads here (the backend service name on the
      # docker network). On Choreo, set this to the backend's public URL instead.
      - BACKEND_URL=http://backend:5005
    depends_on:
      - backend

volumes:
  spacio_data:
