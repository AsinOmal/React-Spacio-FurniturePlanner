# Choreo component configuration for the Spacio backend (Service component).
# Choreo reads this from the component's root (server/) to expose the REST API.
schemaVersion: 1.1

endpoints:
  - name: spacio-api
    displayName: Spacio API
    service:
      # Root base path so Choreo forwards paths UNCHANGED (transparent proxy).
      # The Express app already namespaces its own routes under /api and /uploads,
      # so a /api base path here would double them (/api/api/...). Root also lets
      # the /uploads static route (outside /api) be reachable.
      basePath: /
      port: 5000
    type: REST
    # Public so the frontend's nginx proxy (and you) can reach it.
    networkVisibilities:
      - Public
